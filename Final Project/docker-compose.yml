version: '3.8'

services:
  postgres:
    build: ./docker
    container_name: ce49x-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ce49x
      - POSTGRES_DB=conflict_monitoring
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - pgdata:/var/lib/postgresql/data_postgres

volumes:
  pgdata:
